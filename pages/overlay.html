<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subathon Overlay</title>
  <link rel="stylesheet" href="./assets/css/overlay.css">
</head>
<body>
  <div class="overlay-display" id="overlayDisplay">
    <div class="overlay-value" id="overlayValue">00:00:00</div>
    <div class="overlay-unit" id="overlayUnit">TIME</div>
    <div class="overlay-corner-value" id="overlayCornerValue" style="display: none;"></div>
    <div class="overlay-gifter-card" id="overlayGifterCard" style="display: none !important;">
      <div class="overlay-gifter-content">
        <div class="overlay-gifter-name" id="overlayGifterName">Username</div>
      </div>
      <div class="overlay-gifter-amount">
        <div class="overlay-gifter-value" id="overlayGifterAmount">+00:00:00</div>
        <div class="overlay-gifter-unit" id="overlayGifterUnit">TIME</div>
      </div>
    </div>
  </div>

  <script src="./assets/js/overlay.js"></script>
</body>
</html>

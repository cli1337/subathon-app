<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app_name">Subathon</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div id="toast-container"></div>
    <div class="custom-titlebar">
        <div class="titlebar-drag">
            <div class="titlebar-app-name" data-i18n="app_name">
                Subathon
            </div>
            <div class="titlebar-page-title" id="currentPageTitle" data-i18n="dashboard_title">
                Dashboard
            </div>
        </div>
        <div class="titlebar-controls">
            <button id="minimizeBtn" class="titlebar-btn" title="Minimize" data-i18n-title="title_minimize"><svg viewbox="0 0 24 24">
                    <line x1="6" y1="12" x2="18" y2="12" stroke="currentColor" stroke-width="2"></line>
                </svg></button> <button id="maximizeBtn" class="titlebar-btn" title="Maximize / Restore" data-i18n-title="title_maxrestore"><svg class="max-icon" viewbox="0 0 24 24">
                    <rect x="5" y="5" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"></rect>
                </svg> <svg class="restore-icon" viewbox="0 0 24 24" style="display:none;">
                    <path d="M6 8h4V4h10v10h-4v4H6V8z" fill="none" stroke="currentColor" stroke-width="2"></path>
                    <rect x="8" y="8" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="2"></rect>
                </svg></button> <button id="closeBtn" class="titlebar-btn close" title="Close" data-i18n-title="title_close"><svg viewbox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg></button>
        </div>
    </div>
    <div class="app-container">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <button class="nav-item active" data-page="dashboard"><svg class="nav-icon" viewbox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg> <span data-i18n="dashboard_title">Dashboard</span></button> <button class="nav-item" data-page="platforms"><svg class="nav-icon" viewbox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg> <span data-i18n="platforms_title">Platforms</span></button> <button class="nav-item" data-page="profiles"><svg class="nav-icon" viewbox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg> <span>Profiles</span></button> <button class="nav-item" data-page="metrics"><svg class="nav-icon" viewbox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="9" x2="15" y2="9"></line>
                        <line x1="9" y1="15" x2="15" y2="15"></line>
                        <line x1="12" y1="3" x2="12" y2="21"></line>
                    </svg> <span data-i18n="metrics_title">Metrics</span></button> <button class="nav-item" data-page="overlay"><svg class="nav-icon" viewbox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2">
                        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                        <line x1="7" y1="2" x2="7" y2="22"></line>
                        <line x1="17" y1="2" x2="17" y2="22"></line>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <line x1="2" y1="7" x2="7" y2="7"></line>
                        <line x1="2" y1="17" x2="7" y2="17"></line>
                        <line x1="17" y1="17" x2="22" y2="17"></line>
                        <line x1="17" y1="7" x2="22" y2="7"></line>
                    </svg> <span data-i18n="overlay_title">Overlay</span></button> <button class="nav-item" data-page="reducer"><svg class="nav-icon" viewbox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg> <span>Reducer</span></button> <button class="nav-item" data-page="settings"><svg class="nav-icon" viewbox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v6m0 6v6m0-18a9 9 0 1 1 0 18 9 9 0 0 1 0-18z"></path>
                        <path d="M16.24 7.76l-4.24 4.24m0 0l-4.24 4.24M7.76 7.76l4.24 4.24"></path>
                    </svg> <span data-i18n="settings_title">Settings</span></button>
            </nav>
            <div class="sidebar-footer">
                <div class="status-indicator">
                    <div class="status-dot" id="connectionStatus"></div>
                    <span class="status-text" id="statusText">Inactive</span>
                </div>
            </div>
        </aside>
        <main class="main-content" id="mainContent"></main>
    </div>
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="edit_value">Edit Value</h2>
                <button class="btn btn-icon" id="closeModalBtn"><svg viewbox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg></button>
            </div>
            <div class="modal-body">
                <label data-i18n="new_value">New Value</label>
                <input type="text" id="editValueInput" class="input" placeholder="00:00:00 or 0">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelEditBtn" data-i18n="cancel">Cancel</button> <button class="btn btn-primary" id="saveEditBtn" data-i18n="save">Save</button>
            </div>
        </div>
    </div>
    <div class="modal" id="resetModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Reset Values</h2>
                <button class="btn btn-icon" id="closeResetModalBtn"><svg viewbox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to reset all values? This will:</p>
                <ul style="margin: 16px 0; padding-left: 24px; color: var(--text-secondary);">
                    <li>Set current value to 0</li>
                    <li>Clear all events</li>
                    <li>Reset total events and value added</li>
                </ul>
                <p style="color: var(--danger-color); font-weight: 600;">This action cannot be undone!</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelResetBtn">Cancel</button> <button class="btn btn-danger" id="confirmResetBtn">Reset All Values</button>
            </div>
        </div>
    </div>
    <script src="./assets/js/load-pages.js"></script>
    <script src="./assets/js/custom-dropdown.js"></script>
    <script src="./assets/js/renderer.js"></script>
</body>

</html>

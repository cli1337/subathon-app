<div class="page" id="reducer">
    <header class="page-header">
        <h1>Reducer</h1>
        <p class="page-subtitle">
            Configure automatic reduction of your metric over time
        </p>
    </header>
    <div class="card">
        <div class="card-header">
            <h2>Reducer Settings</h2>
        </div>
        <div class="card-content">
            <div class="form-group">
                <label>Enable Reducer</label>
                <label class="checkbox-label">
                    <input type="checkbox" id="reducerEnabled">
                    <span>Reduce value automatically</span>
                </label>
            </div>
            <div class="form-group">
                <label>Reduce amount per second</label>
                <input type="number" id="reducerAmount" class="input" value="1" step="0.01" min="0">
                <p
                    style="font-size:13px;color:var(--text-secondary);margin-top:6px;">
                    For <strong>Time</strong>: seconds per second (not
                    recommended).<br>
                    For <strong>Distance</strong>: km per second.<br>
                    For <strong>Custom</strong>: your custom units per second.
                </p>
            </div>
            <div class="settings-actions">
                <button class="btn btn-primary" id="saveReducerBtn">
                    Save Reducer
                </button>
            </div>
        </div>
    </div>
</div>

<div class="page" id="profiles">
    <header class="page-header">
        <h1>Profiles</h1>
        <p class="page-subtitle">
            Manage multiple subathon profiles with separate settings and data
        </p>
    </header>
    <div class="card">
        <div class="card-header">
            <h2>Profile Management</h2>
            <button class="btn btn-primary" id="createProfileBtn">
                Create New Profile
            </button>
        </div>
        <div class="card-content">
            <div class="profiles-list" id="profilesList"></div>
        </div>
    </div>
</div>

<div class="modal" id="createProfileModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Create New Profile</h2>
            <button class="btn btn-icon" id="closeCreateProfileModalBtn"><svg viewbox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg></button>
        </div>
        <div class="modal-body">
            <label>Profile Name</label>
            <input type="text" id="newProfileName" class="input" placeholder="Enter profile name">
            <p style="font-size:13px;color:var(--text-secondary);margin-top:6px;">
                Create a new profile with separate settings and data.
            </p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelCreateProfileBtn">Cancel</button>
            <button class="btn btn-primary" id="confirmCreateProfileBtn">Create Profile</button>
        </div>
    </div>
</div>

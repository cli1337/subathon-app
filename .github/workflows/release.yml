name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install pnpm
        run: npm install -g pnpm@10
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Cache Electron and tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ~/.cache/electron
            ~/.cache/electron-builder
            ${{ runner.temp }}/electron-builder-cache
          key: electron-tools-${{ runner.os }}-v39.2.6
          restore-keys: |
            electron-tools-${{ runner.os }}-
      
      - name: Pre-download winCodeSign tool
        run: |
          $toolPath = "$env:LOCALAPPDATA\electron-builder\Cache\winCodeSign"
          New-Item -ItemType Directory -Force -Path $toolPath | Out-Null
          $url = "https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z"
          $output = "$toolPath\winCodeSign-2.6.0.7z"
          Write-Host "Downloading winCodeSign tool..."
          for ($i = 1; $i -le 5; $i++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $output -TimeoutSec 60
              Write-Host "Download successful!"
              break
            } catch {
              Write-Host "Attempt $i failed: $_"
              if ($i -eq 5) { Write-Host "All attempts failed, continuing anyway..." }
              Start-Sleep -Seconds 2
            }
          }
        continue-on-error: true
        timeout-minutes: 5
      
      - name: Build application
        run: pnpm run build:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_GET_USE_PROXY: false
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""
        timeout-minutes: 30
      
      - name: Prepare release files
        run: |
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          Copy-Item dist/*.exe release-files/ -ErrorAction SilentlyContinue
          Copy-Item dist/*.blockmap release-files/ -ErrorAction SilentlyContinue
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release-files/*
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body_path: CHANGELOG.md
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

